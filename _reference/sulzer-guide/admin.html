  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"6b549bf1-0af9-422f-a0fa-7ef5add5a5ea\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<style>\n  *{box-sizing:border-box}\n  html,body{margin:0}\n  body{font-family:\"Helvetica Neue\",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:#f5f7f9;color:#0c1c2e}\n  select,input,button{font-family:inherit}\n  select:focus,input:focus{outline:2px solid #1d59af;outline-offset:1px}\n  @media (max-width:900px){\n    .kpi-grid{grid-template-columns:repeat(2,1fr)!important}\n    .split{grid-template-columns:1fr!important}\n    .topnav{display:none!important}\n    .head-tag{display:none!important}\n  }\n  @media (max-width:560px){\n    .kpi-grid{grid-template-columns:1fr!important}\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#f5f7f9\">\n\n  <!-- header -->\n  <header style=\"background:#fff;border-bottom:1px solid #e3e8ed\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:20px 28px;display:flex;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;align-items:baseline;gap:16px\">\n        <svg viewBox=\"0 0 171 28\" aria-label=\"Sulzer\" style=\"height:28px;fill:#1d59af\"><path d=\"M8.4,0C2.1,0,0,4.3,0,7.1C0,9.5,0,9.9,0,11c0,3,2.8,6.4,6.9,6.4c3.6,0,8,0,8.7,0c1,0,1.2,0.6,1.2,1c0,0.4,0,0.7,0,1c0,0.5-0.4,1-1.2,1c-1,0-15.2,0-15.2,0v7.2c0,0,11.6,0,18.5,0c5,0,7.9-4.4,7.9-7.3c0-2,0-2.7,0-4c0-4.1-4.1-6.9-8.2-6.9c-3.6,0-7.5,0-8.2,0c-0.9,0-1.2-0.6-1.2-1s0-0.4,0-0.7c0-0.5,0.4-1,1.2-1c1,0,15.2,0,15.2,0V0C25.6,0,9.6,0,8.4,0z M30.3,0c0,1.5,0,17.7,0,19.1c0,4.5,3.3,8.9,11,8.9c4.5,0,2,0,6.5,0c8.1,0,10.8-4,10.8-8.9c0-1.3,0-17.6,0-19.1c-2.8,0-9.7,0-9.7,0s0,17.2,0,18.1c0,1.3-0.6,2.4-2.5,2.4h-4.1c-1.9,0-2.5-1-2.5-2.4c0-0.9,0-18.1,0-18.1S33.1,0,30.3,0z M62.7,0v27.7h20.9v-7.2H72.2V0H62.7z M86.1,0.1v6.9h12.7L85.9,20.4v7.2H111v-7.2H98l12.5-13.6V0.1H86.1z M114.7,0.1v27.6h23.4v-7.2h-14.1v-3.6h11.2v-6.8h-11.2V6.8h13.3V0.1H114.7z M141.5,0.1v27.6h8.9V17.4h0.8l8.9,10.2H171c0,0-8.4-9.5-9.2-10.5c1.8,0,6.3-2.4,6.3-7.4V7.4c0-2-1.5-7.3-9-7.3H141.5z M150.2,6.8h6.8c2.1,0,2.1,1.3,2.1,2.3c0,1.5-0.7,2-1.9,2h-6.9V6.8z\"><\u002Fpath><\u002Fsvg>\n        <span class=\"head-tag\" style=\"height:22px;width:1px;background:#d3dae1;align-self:center\"><\u002Fspan>\n        <span class=\"head-tag\" style=\"font-size:15px;color:#5d6b7a;font-weight:400\">Admin · Dashboard<\u002Fspan>\n      <\u002Fdiv>\n      <nav class=\"topnav\" style=\"display:flex;gap:26px;font-size:14px;color:#33465a\">\n        <span style=\"color:#1d59af;font-weight:600\">Dashboard<\u002Fspan>\n        <span>Catalog<\u002Fspan>\n        <span>Webstore<\u002Fspan>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"max-width:1180px;margin:0 auto;padding:30px 28px 60px\">\n\n    <!-- title + range -->\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:24px\">\n      <div>\n        <h1 style=\"margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em\">Pump replacement performance<\u002Fh1>\n        <p style=\"margin:7px 0 0;color:#5d6b7a;font-size:14px\">Sales, search and webstore activity across the replacement guide.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;align-items:center\">\n        <span style=\"font-size:13px;color:#8a97a5\">Period<\u002Fspan>\n        <select value=\"{{ range }}\" onchange=\"{{ onRange }}\" style=\"padding:10px 14px;font-size:14px;border:1px solid #cfd8e1;border-radius:9px;background:#fff;color:#0c1c2e;appearance:none;cursor:pointer\">\n          <sc-for list=\"{{ ranges }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <option value=\"{{ r }}\">{{ r }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fselect>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- KPI grid -->\n    <div class=\"kpi-grid\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:18px\">\n      <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n        <div style=\"background:#fff;border:1px solid #e3e8ed;border-radius:14px;padding:20px 22px\">\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8a97a5\">{{ k.label }}<\u002Fdiv>\n          <div style=\"font-size:32px;font-weight:700;margin-top:10px;color:#0c1c2e;line-height:1\">{{ k.value }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px;margin-top:12px\">\n            <span style=\"display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;color: {{ k.deltaColor }};background: {{ k.deltaBg }}\">{{ k.deltaArrow }} {{ k.delta }}<\u002Fspan>\n            <span style=\"font-size:12px;color:#8a97a5\">vs prior period<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- top pumps + most searched -->\n    <div class=\"split\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px\">\n\n      <!-- top pumps sold -->\n      <div style=\"background:#fff;border:1px solid #e3e8ed;border-radius:14px;padding:22px 24px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px\">\n          <h2 style=\"margin:0;font-size:17px;font-weight:700\">Most-sold replacements<\u002Fh2>\n          <span style=\"font-size:12px;color:#8a97a5\">units<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <sc-for list=\"{{ topPumps }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div>\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:7px\">\n                <span style=\"font-size:14px;font-weight:600;color:#0c1c2e\">{{ p.name }}<\u002Fspan>\n                <span style=\"font-size:14px;font-weight:700;color:#0c1c2e;flex:none\">{{ p.units }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:8px;border-radius:4px;background:#eef1f4;overflow:hidden\">\n                <div style=\"height:100%;border-radius:4px;background:#1d59af;width: {{ p.pct }}\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- most searched -->\n      <div style=\"background:#fff;border:1px solid #e3e8ed;border-radius:14px;padding:22px 24px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px\">\n          <h2 style=\"margin:0;font-size:17px;font-weight:700\">Most-searched part numbers<\u002Fh2>\n          <span style=\"font-size:12px;color:#8a97a5\">queries<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\">\n          <sc-for list=\"{{ topSearches }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid #f0f2f5\">\n              <span style=\"width:24px;height:24px;flex:none;border-radius:6px;background:#eef4fb;color:#1d59af;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">{{ s.rank }}<\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:14px;font-weight:600;color:#0c1c2e\">{{ s.term }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#8a97a5\">{{ s.brand }} → {{ s.maps }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-size:14px;font-weight:700;color:#0c1c2e;flex:none\">{{ s.count }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- geography + webstore funnel -->\n    <div class=\"split\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px\">\n\n      <!-- geography -->\n      <div style=\"background:#fff;border:1px solid #e3e8ed;border-radius:14px;padding:22px 24px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px\">\n          <h2 style=\"margin:0;font-size:17px;font-weight:700\">Where it's most popular<\u002Fh2>\n          <span style=\"font-size:12px;color:#8a97a5\">% of units<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:12px;color:#8a97a5\">Sweden leads the Nordic region by a clear margin.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <sc-for list=\"{{ countries }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:14px\">\n              <span style=\"width:104px;flex:none;font-size:14px;font-weight:600;color:#0c1c2e\">{{ c.name }}<\u002Fspan>\n              <div style=\"flex:1;height:10px;border-radius:5px;background:#eef1f4;overflow:hidden\">\n                <div style=\"height:100%;border-radius:5px;background: {{ c.color }};width: {{ c.pct }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"width:42px;flex:none;text-align:right;font-size:13px;font-weight:700;color:#33465a\">{{ c.pct }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- webstore funnel -->\n      <div style=\"background:#fff;border:1px solid #e3e8ed;border-radius:14px;padding:22px 24px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px\">\n          <h2 style=\"margin:0;font-size:17px;font-weight:700\">Guide → webstore funnel<\u002Fh2>\n          <span style=\"font-size:12px;color:#137040;font-weight:700\">{{ funnelRate }} convert<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ funnel }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div style=\"background: {{ f.bg }};border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;width: {{ f.width }}\">\n              <span style=\"font-size:13px;font-weight:600;color: {{ f.fg }}\">{{ f.stage }}<\u002Fspan>\n              <span style=\"font-size:16px;font-weight:700;color: {{ f.fg }}\">{{ f.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <footer style=\"margin-top:30px;padding-top:24px;border-top:1px solid #e3e8ed;display:flex;justify-content:space-between;align-items:center;color:#8a97a5;font-size:13px;flex-wrap:wrap;gap:8px\">\n      <svg viewBox=\"0 0 171 28\" aria-label=\"Sulzer\" style=\"height:16px;fill:#1d59af\"><path d=\"M8.4,0C2.1,0,0,4.3,0,7.1C0,9.5,0,9.9,0,11c0,3,2.8,6.4,6.9,6.4c3.6,0,8,0,8.7,0c1,0,1.2,0.6,1.2,1c0,0.4,0,0.7,0,1c0,0.5-0.4,1-1.2,1c-1,0-15.2,0-15.2,0v7.2c0,0,11.6,0,18.5,0c5,0,7.9-4.4,7.9-7.3c0-2,0-2.7,0-4c0-4.1-4.1-6.9-8.2-6.9c-3.6,0-7.5,0-8.2,0c-0.9,0-1.2-0.6-1.2-1s0-0.4,0-0.7c0-0.5,0.4-1,1.2-1c1,0,15.2,0,15.2,0V0C25.6,0,9.6,0,8.4,0z M30.3,0c0,1.5,0,17.7,0,19.1c0,4.5,3.3,8.9,11,8.9c4.5,0,2,0,6.5,0c8.1,0,10.8-4,10.8-8.9c0-1.3,0-17.6,0-19.1c-2.8,0-9.7,0-9.7,0s0,17.2,0,18.1c0,1.3-0.6,2.4-2.5,2.4h-4.1c-1.9,0-2.5-1-2.5-2.4c0-0.9,0-18.1,0-18.1S33.1,0,30.3,0z M62.7,0v27.7h20.9v-7.2H72.2V0H62.7z M86.1,0.1v6.9h12.7L85.9,20.4v7.2H111v-7.2H98l12.5-13.6V0.1H86.1z M114.7,0.1v27.6h23.4v-7.2h-14.1v-3.6h11.2v-6.8h-11.2V6.8h13.3V0.1H114.7z M141.5,0.1v27.6h8.9V17.4h0.8l8.9,10.2H171c0,0-8.4-9.5-9.2-10.5c1.8,0,6.3-2.4,6.3-7.4V7.4c0-2-1.5-7.3-9-7.3H141.5z M150.2,6.8h6.8c2.1,0,2.1,1.3,2.1,2.3c0,1.5-0.7,2-1.9,2h-6.9V6.8z\"><\u002Fpath><\u002Fsvg>\n      <span>Figures are indicative analytics for the replacement guide. Updated {{ today }}.<\u002Fspan>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { range: 'Last 90 days' };\n\n  onRange = (e) => this.setState({ range: e.target.value });\n\n  // multiplier so the period selector visibly changes numbers\n  factor() {\n    return { 'Last 30 days': 0.34, 'Last 90 days': 1, 'Year to date': 3.6 }[this.state.range] || 1;\n  }\n  fmt(n) { return Math.round(n).toLocaleString('en-US'); }\n\n  renderVals() {\n    const f = this.factor();\n    const eur = (n) => '\\u20ac ' + this.fmt(n);\n\n    const kpis = [\n      { label: 'Webstore revenue', value: eur(1284000 * f), delta: '14.2%', up: true },\n      { label: 'Units sold via webstore', value: this.fmt(1840 * f), delta: '9.6%', up: true },\n      { label: 'Replacement searches', value: this.fmt(27600 * f), delta: '22.0%', up: true },\n      { label: 'Search → order rate', value: '6.7%', delta: '1.3 pts', up: true },\n    ].map((k) => ({\n      ...k,\n      deltaArrow: k.up ? '\\u2191' : '\\u2193',\n      deltaColor: k.up ? '#137040' : '#b4341f',\n      deltaBg: k.up ? '#eaf7ef' : '#fdecea',\n    }));\n\n    const topRaw = [\n      { name: 'ABS XFP 81C-CB1.3', units: 612 },\n      { name: 'ABS XFP 100C-CB1.4', units: 487 },\n      { name: 'ABS Piranha 08 D', units: 318 },\n      { name: 'ABS XFP 150E-CB2.5', units: 241 },\n      { name: 'ABS AS 0530/2', units: 182 },\n    ];\n    const maxUnits = topRaw[0].units;\n    const topPumps = topRaw.map((p) => ({\n      name: p.name,\n      units: this.fmt(p.units * f),\n      pct: Math.round((p.units / maxUnits) * 100) + '%',\n    }));\n\n    const topSearches = [\n      { term: '581 30 22', brand: 'Grundfos SE1.80.80.22', maps: 'ABS XFP 81C', count: 1420 },\n      { term: 'NP 3085 SH', brand: 'Flygt NP 3085', maps: 'ABS XFP 81C', count: 1185 },\n      { term: '98044186', brand: 'Grundfos SE1', maps: 'ABS XFP 81C', count: 964 },\n      { term: 'Amarex KRT 100-251', brand: 'KSB Amarex', maps: 'ABS XFP 100C', count: 731 },\n      { term: 'KTZ 411', brand: 'Tsurumi KTZ', maps: 'ABS XFP 150E', count: 558 },\n      { term: 'Rexa FIT V06DA', brand: 'Wilo Rexa', maps: 'ABS XFP 81C', count: 472 },\n    ].map((s, i) => ({ ...s, rank: i + 1, count: this.fmt(s.count * f) }));\n\n    const countries = [\n      { name: 'Sweden', pct: '34%', color: '#1d59af' },\n      { name: 'Germany', pct: '19%', color: '#1d59af' },\n      { name: 'Norway', pct: '14%', color: '#4f86ce' },\n      { name: 'Finland', pct: '11%', color: '#4f86ce' },\n      { name: 'Switzerland', pct: '9%', color: '#86abd8' },\n      { name: 'Denmark', pct: '7%', color: '#86abd8' },\n    ];\n\n    const funnel = [\n      { stage: 'Guide searches', value: this.fmt(27600 * f), width: '100%', bg: '#0c1c2e', fg: '#ffffff' },\n      { stage: 'Viewed a match', value: this.fmt(19320 * f), width: '82%', bg: '#1d59af', fg: '#ffffff' },\n      { stage: 'Clicked to webstore', value: this.fmt(7452 * f), width: '60%', bg: '#eef4fb', fg: '#1d59af' },\n      { stage: 'Completed order', value: this.fmt(1840 * f), width: '40%', bg: '#eaf7ef', fg: '#137040' },\n    ];\n\n    return {\n      range: this.state.range,\n      ranges: ['Last 30 days', 'Last 90 days', 'Year to date'],\n      onRange: this.onRange,\n      kpis, topPumps, topSearches, countries, funnel,\n      funnelRate: '6.7%',\n      today: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
